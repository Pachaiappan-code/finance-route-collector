<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>No internet connection</title>
<style>
  :root {
    --background: #f7f8fa;
    --foreground: #14172b;
    --muted: #6b7280;
    --brand-navy: #14225c;
    --brand-navy-strong: #0d1740;
    --border: #e2e4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0b0d16;
      --foreground: #eceef5;
      --muted: #9aa0b4;
      --brand-navy: #4a5fb8;
      --brand-navy-strong: #6577c9;
      --border: #262a3d;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .card { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p { font-size: 14px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button {
    height: 46px;
    padding: 0 28px;
    border-radius: 12px;
    border: none;
    background: var(--brand-navy);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { background: var(--brand-navy-strong); }
  .brand { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No internet connection</h1>
    <p>You're currently offline. Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <div class="brand">EMF Collections</div>
</body>
</html>
